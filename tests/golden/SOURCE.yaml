        reference: "https://github.com/OpenWebNet-HA/MyHOME/issues/304"
        author: "Marco B. (@marcob79)"
        date: "2026-09-12"
        gateway: "BTicino MH201 Scenario Programmer"
        devices: "WHO=2 Automation (Covers & Shutters) with leading-zero (01) and two-digit (11) addresses"
      - name: "Physical Bus Capture (BTicino MH201 + Automation WHO 2, general and area commands)"
        reference: "https://github.com/OpenWebNet-HA/MyHOME/issues/433"
        author: "issue #433 reporter (anonymized: frames and their spacing only)"
        date: "2026-09-23"
        gateway: "BTicino MH201"
        devices: "Eight shutters 11-18 (area 1): keypad point runs, a general UP (*2*0*0## + *2*1*0##) ended by one stop per actuator ~126 s later and none for WHERE 0, an area-1 stop echo (*2*0*1##)"
      - name: "Live Bus Test (BTicino MH200 + F422, Automation WHO 2 scope commands)"
        reference: "https://github.com/OpenWebNet-HA/MyHOME/issues/433"
        author: "Laurens (@GreenGrassBlueOcean)"
        date: "2026-09-23"
        gateway: "BTicino MH200"
        devices: "Covers 11-16, 18, 19 behind F422 interface 02 (logical #4# addressing): area status request answered per object; area commands on the main bus (*2*2*1##) and on the private bus (*2*1*1#4#02##) moved none of them; point commands did"
      - name: "Physical Plant Fixture (BTicino MH201, Automation WHO 2 group run)"
        reference: "https://github.com/OpenWebNet-HA/MyHOME/pull/390"
        author: "@fedem95"
        date: "2026-09-16"
        gateway: "BTicino MH201"
        devices: "Position-reporting covers 19, 0110-0115 in group 1 (MyHOME tests/fixtures/plants/mh201_physical_plant): a group stop and DOWN (*2*0*#1##, *2*2*#1##) echoed per object within 1.6 s, then one end-of-run stop per actuator 5.4-24.3 s later and none for #1"
    role: "Provides authentic on-wire bus frames and status replies captured from live physical hardware."

